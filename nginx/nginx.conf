# ================================================================
# NGINX Load Balancer — WarTiket Microservices
# Kelompok 5 · Scalable Systems Layer
# Konfigurasi penyeimbang beban untuk 4 microservice
# ================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate Limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=order_limit:10m rate=5r/s;

    # ── Upstream: Event Service (2 replicas) ───────────────────
    upstream event_service {
        least_conn;
        server event-service-1:3001 weight=1 max_fails=3 fail_timeout=30s;
        server event-service-2:3001 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream: Ticket Service (3 replicas) ──────────────────
    upstream ticket_service {
        least_conn;
        server ticket-service-1:3002 weight=1 max_fails=3 fail_timeout=30s;
        server ticket-service-2:3002 weight=1 max_fails=3 fail_timeout=30s;
        server ticket-service-3:3002 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream: Payment Service (2 replicas) ─────────────────
    upstream payment_service {
        least_conn;
        server payment-service-1:3003 weight=1 max_fails=3 fail_timeout=30s;
        server payment-service-2:3003 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream: Notification Service (2 replicas) ────────────
    upstream notification_service {
        least_conn;
        server notification-service-1:3004 weight=1 max_fails=3 fail_timeout=30s;
        server notification-service-2:3004 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── API Gateway / Load Balancer ────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name wartiket.local localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-lb","version":"1.0"}';
            add_header Content-Type application/json;
        }

        # Catalog & Events — bisa di-cache, rate limit standar
        location /catalog {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://event_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            add_header X-Upstream $upstream_addr;
        }

        location /events {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://event_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Orders — PALING KRITIS, rate limit ketat
        location /orders {
            limit_req zone=order_limit burst=10 nodelay;
            proxy_pass http://ticket_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            add_header X-Upstream $upstream_addr;
        }

        # Payments
        location /payments {
            limit_req zone=order_limit burst=10 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # Notifications
        location /notifications {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # 429 Too Many Requests
        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"error":"Terlalu banyak request. Coba lagi sebentar.","code":429}';
            add_header Content-Type application/json;
        }
    }
}

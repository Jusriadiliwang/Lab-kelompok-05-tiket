<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 0, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
        }
        .progress-bar-fill {
            transition: width 1s linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-margin-mobile relative overflow-hidden">
<!-- Header (Suppressed Nav, just Logo/Brand anchor) -->
<header class="fixed top-0 w-full z-50 flex justify-center items-center h-14 w-full max-w-screen-xl mx-auto bg-pure-white/80 backdrop-blur-md">
<h1 class="font-headline-md text-headline-md font-bold text-pure-black">War Tiket</h1>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md flex flex-col items-center justify-center space-y-stack-lg z-10 relative mt-14">
<!-- Background Artistic Element -->
<div aria-hidden="true" class="absolute -z-10 w-full h-full opacity-10 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-[300px] text-pure-black" style="font-variation-settings: 'FILL' 0;">hourglass_empty</span>
</div>
<!-- Progress/Status Area -->
<div class="flex flex-col items-center justify-center w-full space-y-stack-md bg-pure-white p-margin-mobile rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.08)] border border-system-gray-light pulse-ring">
<div class="text-center space-y-stack-sm">
<p class="font-headline-md text-headline-md text-pure-black">You are in line.</p>
<p class="font-body-sm text-body-sm text-error font-bold flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">warning</span>
                    Please do not refresh the page.
                </p>
</div>
<!-- Custom Progress Bar -->
<div class="w-full h-3 bg-system-gray-light rounded-full overflow-hidden mt-stack-md relative">
<!-- Using a simulated progress of ~60% for visual -->
<div class="h-full bg-pure-black rounded-full progress-bar-fill w-3/5 relative">
<!-- Shimmer effect on progress bar -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-pure-white/30 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
</div>
<style>
                @keyframes shimmer {
                    100% { transform: translateX(100%); }
                }
            </style>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-2 gap-gutter-mobile w-full">
<!-- Position -->
<div class="flex flex-col items-center justify-center p-stack-md bg-pure-white rounded-lg border border-system-gray-light shadow-sm">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider mb-unit">Current Position</span>
<span class="font-display-ticket-war text-display-ticket-war text-pure-black md:hidden">3,402</span>
<span class="font-display-ticket-war text-display-ticket-war text-pure-black hidden md:block" style="font-size: 36px; line-height: 40px;">3,402</span> <!-- Slight scale down for bento feel on larger -->
</div>
<!-- Wait Time -->
<div class="flex flex-col items-center justify-center p-stack-md bg-pure-white rounded-lg border border-system-gray-light shadow-sm">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider mb-unit">Est. Wait Time</span>
<div class="flex items-baseline space-x-1">
<span class="font-display-ticket-war text-display-ticket-war text-pure-black md:hidden">12</span>
<span class="font-display-ticket-war text-display-ticket-war text-pure-black hidden md:block" style="font-size: 36px; line-height: 40px;">12</span>
<span class="font-body-sm text-body-sm text-secondary">min</span>
</div>
</div>
</div>
<!-- Contextual Info -->
<div class="w-full flex items-center p-stack-sm bg-surface-container-low rounded-lg border border-system-gray-light mt-stack-md">
<div class="w-12 h-12 bg-system-gray-light rounded mr-stack-sm overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A macro, abstract close-up shot of a modern concert stage lighting rig in a minimalist setting. The lights are off, waiting in the dark. Deep blacks and pristine whites dominate the high-contrast scene, emphasizing calm precision and premium exclusivity before the show begins. Highly detailed, photorealistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuhHzuitK0JeCMR6rPdj1hrhx9mLyvccj2cWQFqX71UCt1T1SkhtR64AAu66zvozznTCRxOlr08kg9quOIvazX3UGaX4Fexh1ajV4bG1PkXigPIiJXxaQ1s0YdRbzyh28aJxE-_BDncTBS9Yc5njSkYoyHPHm_Y_Tn4vVqwvfkf4ISSRmrhws6Kq-AfdWRyA5X7_PRb4Z4FHCkTG35-aQdAKHQjkdVTbkGmig1xaOX5aJtRl1LLKiR"/>
</div>
<div class="flex flex-col justify-center">
<p class="font-body-sm text-body-sm font-bold text-pure-black line-clamp-1">World Tour 2024 - General Admission</p>
<p class="font-label-caps text-label-caps text-secondary">Saturday, Oct 12 • 8:00 PM</p>
</div>
</div>
</main>
<!-- Bottom Safespace / Footer info -->
<div class="fixed bottom-0 w-full p-margin-mobile flex justify-center pb-safe text-center">
<p class="font-label-caps text-label-caps text-secondary flex items-center gap-1 opacity-70">
<span class="material-symbols-outlined text-[14px]">lock</span>
            Secure Queue Connection
        </p>
</div>
</body></html>

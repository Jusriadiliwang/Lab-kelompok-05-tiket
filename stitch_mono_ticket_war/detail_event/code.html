<script>
        // Simple mock countdown animation
        function updateCountdown() {
            const timerElement = document.getElementById('countdown-timer');
            let [hours, minutes, seconds] = timerElement.innerText.split(':').map(Number);
            
            if (seconds > 0) {
                seconds--;
            } else {
                if (minutes > 0) {
                    minutes--;
                    seconds = 59;
                } else if (hours > 0) {
                    hours--;
                    minutes = 59;
                    seconds = 59;
                }
            }

            timerElement.innerText = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0');
                
            // Increase weight in last 60 seconds (mock logic, applying if under 1 min)
            if (hours === 0 && minutes === 0 && seconds <= 60) {
                 timerElement.classList.remove('font-countdown');
                 timerElement.style.fontWeight = '800'; // Extra bold for urgency
            }
        }

        setInterval(updateCountdown, 1000);

        // Radio button total update mock
        const radios = document.querySelectorAll('input[name="ticket_type"]');
        const totalDisplay = document.querySelector('.glass-checkout .font-headline-md');

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'vip') totalDisplay.innerText = '$450';
                if(e.target.value === 'festival') totalDisplay.innerText = '$150';
            });
        });
    </script>
